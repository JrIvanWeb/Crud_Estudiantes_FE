<app-header></app-header>

<div class="container py-4 pt-lg-4">
  <div class="row justify-content-center g-4">

    <!-- Card Bienvenida -->
    <div class="col-lg-6 col-md-12">
      <div class="card p-4 shadow-sm h-100">
        <h4 class="fw-bold title-blue text-center mb-4">
          <i class="bi bi-info-circle-fill me-2"></i>
          Bienvenido a SAEG
        </h4>

        <p class="text-muted">
          Estimado estudiante, si estás próximo a graduarte, te invitamos a
          iniciar la revisión de tu hoja de vida académica.
        </p>

        <p class="text-muted">
          Haz clic en el siguiente botón para comenzar el proceso.
        </p>

        <button class="btn btn-primary w-100 mt-3">
          <i class="bi bi-file-earmark-text me-2"></i>
          Solicitar estudio de hoja de vida académica
        </button>
      </div>
    </div>

    <!-- Card Login -->
    <div class="col-lg-5 col-md-12">
      <div class="card p-4 shadow-sm h-100">
        <h4 class="fw-bold title-blue text-center mb-4">
          <i class="bi bi-lock-fill me-2"></i>
          Iniciar sesión
        </h4>

        <form>
          <div class="mb-3">
            <input
              type="email"
              class="form-control"
              placeholder="Correo institucional">
          </div>

          <div class="mb-3">
            <input
              type="password"
              class="form-control"
              placeholder="Contraseña">
          </div>

          <button class="btn btn-secondary w-100">
            <i class="bi bi-box-arrow-in-right me-2"></i>
            Iniciar sesión
          </button>
        </form>
      </div>
    </div>

  </div>
</div>

<app-footer></app-footer>
