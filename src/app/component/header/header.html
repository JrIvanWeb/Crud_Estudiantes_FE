<div class="w-100" style="background-color:#012f79;">
  <div class="container-fluid px-4">
    <ul class="nav justify-content-end small py-2 gap-4">

      <li class="nav-item">
        <a class="nav-link text-white p-0" href="#">Aspirantes</a>
      </li>

      <li class="nav-item">
        <a class="nav-link text-white p-0" href="#">Estudiantes</a>
      </li>

      <li class="nav-item">
        <a class="nav-link text-white p-0" href="#">Docentes</a>
      </li>

      <li class="nav-item">
        <a class="nav-link text-white p-0" href="#">Egresados</a>
      </li>

      <li class="nav-item">
        <a class="nav-link text-white p-0" href="#">Funcionarios</a>
      </li>

    </ul>
  </div>
</div>
<nav class="navbar navbar-expand-lg py-3" style="background-color:#023280;">
  <div class="container-fluid px-4">

    <!-- Logo -->
    <a class="navbar-brand d-flex align-items-center text-white me-5" routerLink="/">
      <img src="assets/Unimag.png" alt="Logo" style="height: 64px;" class="me-3" />
      
      <h4>Universidad del Magdalena</h4>
    </a>

    <!-- Toggle -->
    <button class="navbar-toggler text-white" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Contenido -->
    <div class="collapse navbar-collapse" id="mainNavbar">
      <div class="ms-auto d-flex align-items-center gap-3">

        <!-- Buscador -->
        <div class="input-group input-group-sm" style="max-width: 200px;">
          <span class="input-group-text bg-white">
            <i class="bi bi-search"></i>
          </span>
          <input class="form-control" type="search" placeholder="Buscar..." [(ngModel)]="searchText"
            name="searchText" />
        </div>

        <!-- Botón -->
        <button class="btn btn-outline-light btn-sm px-4" (click)="onStart()">
          Empezar
        </button>

      </div>
    </div>

  </div>
</nav>
<div style="width:100%; height:2px; background-color: orange;"></div>
